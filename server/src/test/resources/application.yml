# 테스트는 MySQL 없이 돈다. Flyway 스크립트는 MySQL 방언이라 여기서는 끄고
# 엔티티로 스키마를 만든다. 스키마 자체의 검증은 실제 실행에서 이루어진다.
spring:
  datasource:
    url: jdbc:h2:mem:gujuck-game;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

game:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
    expiration-seconds: 3600
  cors:
    allowed-origins: http://localhost:5170
