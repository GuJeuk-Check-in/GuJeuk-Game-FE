server:
  # 프론트 개발 서버가 5170~5173을 쓰므로 겹치지 않는 포트를 쓴다.
  port: 8090

spring:
  application:
    name: gujuck-game-server
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/gujuck_game?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:game}
    password: ${DB_PASSWORD:game}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate가 손대면 두 곳이 서로를 덮어쓴다.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

game:
  jwt:
    # 운영에서는 반드시 환경변수로 덮어쓴다.
    secret: ${JWT_SECRET:gujuck-game-local-dev-secret-key-please-override-in-production}
    expiration-seconds: 604800
  cors:
    # 프론트 개발 서버 포트를 전부 적는다. 하나라도 빠지면 그 게임만 브라우저가
    # 요청을 막는데, 콘솔을 열기 전에는 서버가 죽은 것처럼 보인다.
    # home 5170, tic-tac-toe 5171, alkkagi 5172, archery 5173
    allowed-origins: ${CORS_ORIGINS:http://localhost:5170,http://localhost:5171,http://localhost:5172,http://localhost:5173,https://game.oijwef098234.com}
