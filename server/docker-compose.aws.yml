# EC2 배포용. 체크인 서버(prod 8080 / stag 8081)와 같은 호스트에 얹되
# 포트와 DB를 완전히 분리한다. 게임과 체크인은 도메인도 데이터도 겹치지 않는다.
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: ${APP_CONTAINER_NAME:-gujuck-game-app}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gujuck_game}?serverTimezone=Asia/Seoul
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx160m}
    ports:
      # Caddy가 host.docker.internal:8090 으로 붙는다. 외부에 직접 열지 않는다.
      - "127.0.0.1:${APP_PORT:-8090}:8090"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-gujuck-game-mysql}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gujuck_game}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - game_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  game_mysql:
    name: gujuck-game-mysql-data
