name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # 앱은 build 안에서 tsc --noEmit을 먼저 돌리지만, 앱이 import 하지 않는
      # 공유 패키지(@gujuck/api 등)는 그 그래프에 안 잡힌다. 따로 검사한다.
      - name: Typecheck
        run: yarn turbo typecheck

      - name: Build all apps
        run: yarn turbo build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    strategy:
      # 한 게임 배포가 실패해도 나머지는 올라가야 한다.
      fail-fast: false
      matrix:
        # 게임을 추가할 때 손댈 곳은 여기 한 줄과 GitHub 시크릿뿐이다.
        # secret 값은 VERCEL_PROJECT_ID_<secret> 시크릿 이름으로 조합된다.
        app:
          - { slug: home, secret: HOME }
          - { slug: tic-tac-toe, secret: TIC_TAC_TOE }
          - { slug: alkkagi, secret: ALKKAGI }
          - { slug: archery, secret: ARCHERY }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Check Vercel secrets
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.app.secret)] }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.app.slug }} 배포를 건너뜁니다. VERCEL_TOKEN 또는 VERCEL_PROJECT_ID_${{ matrix.app.secret }} 시크릿이 없습니다."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ matrix.app.slug }}
        if: steps.check.outputs.ready == 'true'
        run: >
          vercel --prod --yes
          --local-config apps/${{ matrix.app.slug }}/vercel.json
          --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.app.secret)] }}
