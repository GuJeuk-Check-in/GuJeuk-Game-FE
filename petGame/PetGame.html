<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>구즉 펫 타운</title>
<style>
  :root{
    --card:#FFFBF5; --ink:#4A3B33; --soft:#9A8675; --faint:#BFA88F; --line:#EADFD2;
    --accent:#7F77DD; --accent2:#6A62C9; --warm:#EF9A6E; --warm2:#E08454;
    --floor:#E6BE8E; --floor2:#DCB081; --good:#2FB182; --bad:#E0613B;
    --r:14px; --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--ink);background:#DCC9B4;display:flex;align-items:center;justify-content:center;min-height:100dvh;}
  #phone{width:100%;max-width:430px;height:100dvh;max-height:880px;background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.18);}
  @media(min-width:460px){#phone{border-radius:30px;height:min(880px,96dvh);}}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--card);}
  .screen.on{display:flex;}

  /* LOGIN */
  #s-login{align-items:center;justify-content:center;padding:30px 26px;text-align:center;background:linear-gradient(#FFF7EE,#FBEAD7);}
  .logo{font-size:30px;font-weight:800;letter-spacing:-.02em;}
  .tagline{font-size:14px;color:var(--soft);margin-top:10px;line-height:1.6;}
  .mascotrow{display:flex;gap:6px;justify-content:center;margin:22px 0 24px;}
  .mascotrow .mini{width:84px;height:96px;}
  .mascotrow .mini svg{width:100%;height:100%;}
  .field{width:100%;max-width:300px;margin-top:10px;text-align:left;}
  .field label{font-size:12px;color:var(--soft);font-weight:600;margin-left:3px;}
  .field input{width:100%;margin-top:5px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);font-size:16px;font-family:var(--font);outline:none;background:#fff;color:var(--ink);}
  .field input:focus{border-color:var(--accent);}
  .btn{width:100%;max-width:300px;padding:15px;border:none;border-radius:var(--r);font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;transition:transform .1s,background .15s;}
  .btn-primary{background:var(--accent);color:#fff;margin-top:18px;}
  .btn-primary:active{transform:scale(.985);background:var(--accent2);}
  .btn-primary:disabled{background:#D9D3F0;}
  .loginnote{font-size:11.5px;color:var(--faint);margin-top:16px;max-width:300px;}

  /* SELECT */
  #s-select{padding:24px 20px;overflow:auto;}
  .h1{font-size:21px;font-weight:800;text-align:center;}
  .h2{font-size:13px;color:var(--soft);text-align:center;margin-top:7px;line-height:1.5;}
  .picks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:20px;}
  .pick{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px 4px 11px;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s;}
  .pick:active{transform:scale(.97);}
  .pick.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,119,221,.15);}
  .pick .pv{height:96px;display:flex;align-items:flex-end;justify-content:center;}
  .pick .pv svg{height:96px;width:auto;}
  .pick .pn{font-size:13.5px;font-weight:700;margin-top:5px;}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:5px;}
  .badge.pet{background:#FAE9E1;color:#A24A28;}.badge.plant{background:#E9F2DC;color:#41700F;}.badge.tiger{background:#FCEBD2;color:#9A6112;}
  .pick .pd{font-size:10.5px;color:var(--soft);margin-top:6px;min-height:26px;line-height:1.35;}
  #nameWrap{margin-top:20px;display:none;}#nameWrap.on{display:block;}
  .lbl{font-size:12.5px;color:var(--soft);font-weight:600;margin-bottom:7px;}

  /* GAME */
  header{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);}
  .hname{font-size:15px;font-weight:800;line-height:1.05;}
  .hstage{font-size:10.5px;color:var(--soft);margin-top:2px;}
  .hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .pts{display:flex;align-items:center;gap:5px;background:#FBF2E6;border:1px solid #F0E2CE;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;color:#B5751F;}
  .iconbtn{width:33px;height:33px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--soft);}

  #room{position:relative;flex:1;min-height:0;overflow:hidden;}
  #wall{position:absolute;left:0;right:0;top:0;bottom:34%;background:linear-gradient(#F6E9DB,#F1E0CD);}
  #floor{position:absolute;left:0;right:0;top:66%;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 54px,rgba(150,110,70,.12) 54px 56px),linear-gradient(var(--floor),var(--floor2));}
  #winf{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:140px;height:104px;border-radius:13px;background:#C98E63;padding:7px;}
  #wini{width:100%;height:100%;border-radius:7px;overflow:hidden;}#wini svg{width:100%;height:100%;display:block;}
  .winbar{position:absolute;background:#C98E63;}
  #wbv{top:7px;bottom:7px;left:50%;width:6px;transform:translateX(-50%);border-radius:3px;}
  #wbh{left:7px;right:7px;top:50%;height:6px;transform:translateY(-50%);border-radius:3px;}
  #rug{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:74%;height:48px;background:radial-gradient(closest-side,#F0C9A6,#E7B98C);border-radius:50%;opacity:.85;}
  #night{position:absolute;inset:0;background:#243056;opacity:0;transition:opacity 1s;pointer-events:none;mix-blend-mode:multiply;}
  .prop{position:absolute;z-index:3;pointer-events:none;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));}
  #pr_ball{font-size:52px;left:13%;bottom:7%;animation:ball 2.4s ease-in-out infinite;}
  #pr_balloon{font-size:62px;left:80%;bottom:41%;animation:float 3.6s ease-in-out infinite;}
  #pr_cushion{font-size:60px;left:76%;bottom:5%;}
  #pr_bone{font-size:54px;left:24%;bottom:5%;transform:rotate(-12deg);}
  #pr_gift{font-size:56px;left:67%;bottom:7%;animation:float 4s ease-in-out infinite;}
  #pr_lamp{font-size:68px;left:7%;bottom:34%;}
  #pr_teddy{font-size:62px;left:83%;bottom:19%;}
  #pr_flowerpot{font-size:62px;left:8%;bottom:20%;}
  #pr_book{font-size:52px;left:40%;bottom:5%;transform:rotate(6deg);}
  @keyframes ball{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}

  #petc{position:absolute;bottom:9%;left:50%;width:0;height:0;z-index:5;}
  #bubble{position:absolute;left:50%;bottom:150px;transform:translate(-50%,6px);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap;max-width:240px;box-shadow:0 6px 16px rgba(74,59,51,.13);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;}
  #bubble.show{opacity:1;transform:translate(-50%,0);}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #fff;}
  #petface{position:absolute;left:50%;bottom:0;transform:translateX(-50%);transform-origin:bottom center;}
  #petface svg{height:150px;width:auto;display:block;filter:drop-shadow(0 6px 5px rgba(0,0,0,.08));overflow:visible;}
  #petface.walk{animation:walk .45s ease-in-out infinite;}
  #petface.hop{animation:hop .6s ease;}
  #petface.breathe{animation:breathe 3s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateX(-50%) scaleY(1);}50%{transform:translateX(-50%) scaleY(1.03) translateY(-2px);}}
  @keyframes walk{0%,100%{transform:translateX(-50%) translateY(0) rotate(-2deg);}50%{transform:translateX(-50%) translateY(-7px) rotate(2deg);}}
  @keyframes hop{0%{transform:translateX(-50%) translateY(0);}30%{transform:translateX(-50%) translateY(-26px);}60%{transform:translateX(-50%) translateY(0) scaleY(.94);}100%{transform:translateX(-50%) translateY(0);}}
  .fx{position:absolute;bottom:150px;left:50%;font-size:20px;pointer-events:none;z-index:7;animation:fxup 1s ease-out forwards;}
  @keyframes fxup{0%{opacity:0;transform:translate(-50%,0) scale(.5);}20%{opacity:1;}100%{opacity:0;transform:translate(-50%,-60px) scale(1.1);}}

  #stats{padding:10px 15px 2px;}
  .stat{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .stat .ic{width:18px;text-align:center;font-size:13px;}
  .stat .lab{width:40px;font-size:11px;color:var(--soft);font-weight:600;}
  .stat .tk{flex:1;height:8px;background:#EADFD2;border-radius:999px;overflow:hidden;}
  .stat .fl{height:100%;border-radius:999px;transition:width .5s,background .3s;}
  .stat .pc{width:28px;text-align:right;font-size:10.5px;color:var(--soft);}
  .xpw{margin-top:0;padding-top:7px;border-top:1px dashed var(--line);}
  .xprow{display:flex;justify-content:space-between;margin-bottom:6px;}
  .xprow .l{font-size:11px;color:var(--soft);font-weight:600;}.xprow .v{font-size:10.5px;color:var(--accent);font-weight:700;}
  .xptk{height:8px;background:#EADFD2;border-radius:999px;overflow:hidden;}
  .xpfl{height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .5s;}

  #actions{padding:9px 14px 14px;}
  .agrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .act{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 2px 7px;cursor:pointer;text-align:center;transition:transform .1s,opacity .15s;}
  .act:active{transform:scale(.95);}.act:disabled{opacity:.35;}
  .act .ai{font-size:19px;}.act .at{font-size:10px;font-weight:600;margin-top:3px;}.act .ac{font-size:9px;color:var(--faint);margin-top:1px;}
  #dailyInfo{margin-top:9px;text-align:center;font-size:11.5px;font-weight:600;color:#B5751F;background:#FBF2E6;border:1px solid #F0E2CE;border-radius:10px;padding:8px;}

  .modal{position:absolute;inset:0;z-index:30;background:rgba(60,46,38,.42);display:none;align-items:flex-end;}
  .modal.on{display:flex;}
  .sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px 22px;max-height:82%;overflow:auto;animation:su .25s ease;}
  @keyframes su{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sh{display:flex;align-items:center;margin-bottom:10px;}
  .sh .t{font-size:16px;font-weight:800;}.sh .x{margin-left:auto;}
  .tabs{display:flex;gap:7px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:9px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--soft);}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .item{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .item:last-child{border:none;}
  .si{width:48px;height:48px;border-radius:13px;background:#FBF2E6;display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0;}
  .sib{flex:1;min-width:0;}
  .sin{font-size:13.5px;font-weight:700;}
  .sid{font-size:11px;color:var(--soft);margin-top:1px;line-height:1.35;}
  .price{font-size:11.5px;color:#B5751F;font-weight:700;margin-top:2px;}
  .ibtn{border:none;background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:8px 13px;border-radius:999px;cursor:pointer;font-family:var(--font);flex-shrink:0;min-width:62px;}
  .ibtn:disabled{background:#DBD6EF;}
  .ibtn.own{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
  .ibtn.on{background:var(--good);color:#fff;}
  .ibtn.have{background:#EFE9DF;color:#8A7A68;}
  .menurow{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
  .menubtn{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;color:var(--ink);text-align:left;}
  .menubtn.danger{color:var(--bad);border-color:#F2D4C9;}
  .ssub{font-size:12px;color:var(--soft);margin-bottom:12px;}

  #toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(8px);z-index:35;background:rgba(74,59,51,.94);color:#fff;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion:reduce){#petface.walk,#petface.breathe,.prop{animation:none;}}
</style>
</head>
<body>
<div id="phone">

  <div class="screen on" id="s-login">
    <div class="logo">📍 구즉 펫 타운</div>
    <div class="tagline">매일 들러서 포인트를 모으고<br>나만의 친구를 키우고 꾸며요</div>
    <div class="mascotrow" id="loginMascots"></div>
    <div class="field"><label>이름</label><input id="nick" type="text" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off"></div>
    <div class="field"><label>휴대폰 번호</label><input id="loginPhone" type="tel" maxlength="13" placeholder="010-0000-0000" autocomplete="off" inputmode="numeric"></div>
    <button class="btn btn-primary" id="loginBtn" disabled>로그인</button>
    <div class="loginnote">* 프로토타입입니다. 이름과 번호만 입력하면 바로 시작돼요.</div>
  </div>

  <div class="screen" id="s-select">
    <div class="h1">함께할 친구 고르기</div>
    <div class="h2">한 번 고르면 이 친구를 쭉 키우게 돼요</div>
    <div class="picks" id="picks"></div>
    <div id="nameWrap">
      <div class="lbl">이름 지어주기</div>
      <div class="field" style="max-width:none;margin-top:0"><input id="petname" type="text" maxlength="8" placeholder="예) 몽실이" autocomplete="off"></div>
      <button class="btn btn-primary" id="selStart" style="max-width:none" disabled>이 친구와 시작하기</button>
    </div>
  </div>

  <div class="screen" id="s-game">
    <header>
      <div><div class="hname" id="hname">—</div><div class="hstage" id="hstage">—</div></div>
      <div class="hright"><div class="pts">⭐ <span id="hpts">0</span></div><button class="iconbtn" id="menuBtn">⚙️</button></div>
    </header>
    <div id="room">
      <div id="wall"></div><div id="floor"></div>
      <div id="winf"><div id="wini">
        <svg viewBox="0 0 130 96" preserveAspectRatio="xMidYMid slice">
          <rect id="sky" width="130" height="96" fill="#BFE3F5"/>
          <g id="stars" opacity="0"><circle cx="20" cy="18" r="1.3" fill="#fff"/><circle cx="50" cy="13" r="1" fill="#fff"/><circle cx="86" cy="20" r="1.3" fill="#fff"/><circle cx="110" cy="15" r="1" fill="#fff"/><circle cx="64" cy="36" r="1" fill="#fff"/></g>
          <circle id="celest" cx="100" cy="26" r="13" fill="#FFD66B"/>
          <path d="M0 74 Q34 56 66 72 Q100 90 130 70 L130 96 L0 96 Z" fill="#9BC98C"/>
          <path d="M0 84 Q40 74 80 84 Q108 92 130 82 L130 96 L0 96 Z" fill="#7FB873"/>
        </svg>
      </div><div class="winbar" id="wbv"></div><div class="winbar" id="wbh"></div></div>
      <div id="rug"></div>
      <div id="propLayer"></div>
      <div id="night"></div>
      <div id="petc"><div id="bubble"></div><div id="petface"></div></div>
      <div id="toast"></div>
    </div>
    <div id="stats">
      <div class="stat"><span class="ic">🍖</span><span class="lab" id="lbFeed">배고픔</span><span class="tk"><span class="fl" id="fHunger"></span></span><span class="pc" id="pHunger">0</span></div>
      <div class="stat"><span class="ic">😊</span><span class="lab">행복</span><span class="tk"><span class="fl" id="fHappy"></span></span><span class="pc" id="pHappy">0</span></div>
      <div class="stat"><span class="ic">🫧</span><span class="lab">청결</span><span class="tk"><span class="fl" id="fClean"></span></span><span class="pc" id="pClean">0</span></div>
      <div class="stat"><span class="ic">⚡</span><span class="lab">에너지</span><span class="tk"><span class="fl" id="fEnergy"></span></span><span class="pc" id="pEnergy">0</span></div>
      <div class="xpw"><div class="xprow"><span class="l">성장 경험치</span><span class="v" id="xpText">0 / 30</span></div><div class="xptk"><span class="xpfl" id="xpFill"></span></div></div>
    </div>
    <div id="actions">
      <div class="agrid">
        <button class="act" data-a="feed"><div class="ai" id="iFeed">🍖</div><div class="at" id="tFeed">밥주기</div><div class="ac">-1</div></button>
        <button class="act" data-a="play"><div class="ai" id="iPlay">🎾</div><div class="at" id="tPlay">놀기</div><div class="ac">-2</div></button>
        <button class="act" data-a="clean"><div class="ai">🫧</div><div class="at" id="tClean">씻기기</div><div class="ac">-2</div></button>
        <button class="act" data-a="sleep"><div class="ai" id="iSleep">😴</div><div class="at" id="tSleep">재우기</div><div class="ac">-1</div></button>
        <button class="act" id="shopBtn"><div class="ai">🛍️</div><div class="at">상점</div><div class="ac">꾸미기</div></button>
      </div>
      <div id="dailyInfo">—</div>
    </div>
  </div>

  <div class="modal" id="shopModal"><div class="sheet">
    <div class="sh"><div class="t">상점 🛍️</div><button class="iconbtn x" id="shopClose">✕</button></div>
    <div class="tabs"><div class="tab on" data-tab="hat">🧢 꾸미기</div><div class="tab" data-tab="prop">⚽ 소품</div><div class="tab" data-tab="buff">✨ 효과</div></div>
    <div id="shopList"></div>
  </div></div>

  <div class="modal" id="menuModal"><div class="sheet">
    <div class="sh"><div class="t">메뉴 ⚙️</div><button class="iconbtn x" id="menuClose">✕</button></div>
    <div class="ssub" id="menuStats">—</div>
    <div class="menurow">
      <button class="menubtn" id="logoutBtn">🔓 로그아웃</button>
      <button class="menubtn danger" id="resetBtn">🗑️ 처음부터 다시 시작</button>
    </div>
  </div></div>

</div>
<script>

/* ===== game ===== */
var posX=0,targetX=0,moving=false,mode="idle",lastTs=0,nextAt=0,minX=60,maxX=320,centerX=200;
var face,petc,room,bubble,bubbleT,lastSpoke=0,toastT;

function bounds(){var w=room.clientWidth;minX=54;maxX=w-54;centerX=w/2;if(maxX<minX)maxX=minX;}
function canWander(){return !isPlant(state.species)&&state.stage>=1&&mode==="idle";}
function applyPos(){petc.style.left=posX+"px";}
function setSprite(){var base=SPRITES[state.species][state.stage];var extra="";var a=ANCH[state.species][state.stage];
  if(a){if(state.equipped.shirt)extra+=mkShirt(state.equipped.shirt,a.body);if(state.equipped.hat)extra+=mkHat(state.equipped.hat,a.head);}
  face.innerHTML=base.replace("</svg>",extra+"</svg>");}
function placePet(){bounds();if(!isPlant(state.species)&&state.stage>=1){if(posX<minX||posX>maxX)posX=centerX;}else posX=centerX;applyPos();}

function loop(ts){if(!lastTs)lastTs=ts;var dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;
  if(moving){var sp=44*(state.energy<25?.62:1);var d=Math.sign(targetX-posX);posX+=d*sp*dt;
    if((d>0&&posX>=targetX)||(d<0&&posX<=targetX)||Math.abs(targetX-posX)<1.2){posX=targetX;applyPos();arrive();}else applyPos();
  }else if(canWander()&&ts>nextAt){wander();}
  requestAnimationFrame(loop);}
function wander(){var t,tr=0;do{t=minX+Math.random()*(maxX-minX);tr++;}while(Math.abs(t-posX)<60&&tr<8);targetX=t;moving=true;mode="walk";face.classList.remove("breathe");face.classList.add("walk");}
function arrive(){moving=false;mode="idle";face.classList.remove("walk");face.classList.add("breathe");nextAt=performance.now()+(900+Math.random()*2400);if(Math.random()<.3)hop();}
function hop(){face.classList.remove("hop");void face.offsetWidth;face.classList.add("hop");setTimeout(function(){face.classList.remove("hop");},620);}
function fx(em){var e=document.createElement("div");e.className="fx";e.textContent=em;e.style.left=posX+"px";room.appendChild(e);setTimeout(function(){e.remove();},1000);}
function bub(t,d){if(!t)return;bubble.textContent=t;bubble.classList.add("show");lastSpoke=performance.now();clearTimeout(bubbleT);bubbleT=setTimeout(function(){bubble.classList.remove("show");},d||3200);}
function speak(cat,d){bub(line(cat),d);}

function renderProps(){var lay=$("propLayer");lay.innerHTML="";state.placed.forEach(function(id){var it=shopFind(id);if(!it)return;var e=document.createElement("div");e.className="prop";e.id="pr_"+id;e.textContent=it.ic;lay.appendChild(e);});}

function setFill(k,f,p){var v=Math.round(state[k]);var el=$(f);el.style.width=v+"%";el.style.background=v<25?"#E0613B":({hunger:"#E08A4E",happy:"#2FB182",clean:"#3F9CD6",energy:"#8B83E6"})[k];$(p).textContent=v;}
function render(){
  $("hname").textContent=state.petName;
  $("hstage").textContent=SPECIES[state.species]+" · "+STAGES[state.species][state.stage]+" 단계";
  $("hpts").textContent=state.points;
  setFill("hunger","fHunger","pHunger");setFill("happy","fHappy","pHappy");setFill("clean","fClean","pClean");setFill("energy","fEnergy","pEnergy");
  var cur=STAGE_XP[state.stage],nx=STAGE_XP[state.stage+1];
  if(nx===undefined){$("xpText").textContent="최고 단계!";$("xpFill").style.width="100%";}
  else{var into=state.xp-cur,need=nx-cur;$("xpText").textContent=into+" / "+need;$("xpFill").style.width=Math.max(0,Math.min(100,into/need*100))+"%";}
  document.querySelector('[data-a="feed"]').disabled=state.points<1;
  document.querySelector('[data-a="play"]').disabled=state.points<2;
  document.querySelector('[data-a="clean"]').disabled=state.points<2;
  document.querySelector('[data-a="sleep"]').disabled=state.points<1;
  var today=new Date().toDateString();
  $("dailyInfo").textContent=(state.lastLoginDay===today)?("🎁 오늘 출석 보너스 받았어요 · 연속 "+(state.streak||1)+"일 · 내일 또 만나요!"):"🎁 오늘의 출석 보너스를 받을 수 있어요";
}
function labels(){var pl=isPlant(state.species);
  $("lbFeed").textContent=pl?"수분":"배고픔";$("iFeed").textContent=pl?"💧":"🍖";$("tFeed").textContent=pl?"물주기":"밥주기";
  $("iPlay").textContent=pl?"☀️":"🎾";$("tPlay").textContent=pl?"햇볕":"놀기";$("tClean").textContent=pl?"잎청소":"씻기기";
  $("iSleep").textContent=pl?"🌙":"😴";$("tSleep").textContent=pl?"휴식":"재우기";}

function stageFromXp(xp){var s=0;for(var i=0;i<STAGE_XP.length;i++)if(xp>=STAGE_XP[i])s=i;return s;}
function gainXp(n){state.xp=(state.xp||0)+n;var ns=stageFromXp(state.xp);if(ns>(state.stage||0)){state.stage=ns;if(face){setSprite();placePet();fx("✨");setTimeout(function(){speak("growth",3600);},250);}}}
function ax(n){return hasBuff("xpboost")?Math.round(n*1.1):n;}
function actionXp(base,before,minStat){var room=(100-before)/100;var full=Math.max(0.04,Math.min(1,room*1.3));var cond=minStat>=50?1:(0.4+0.6*(minStat/50));var x=base*full*cond*(hasBuff("xpboost")?1.1:1);return (before>=95)?0:Math.max(1,Math.round(x));}

var FREE={feed:{c:1,xp:5,s:"hunger",a:22},play:{c:2,xp:10,s:"happy",a:24},clean:{c:2,xp:6,s:"clean",a:28},sleep:{c:1,xp:4,s:"energy",a:30}};
function doFree(t){var a=FREE[t];if(state.points<a.c){toast("포인트가 부족해요!");return;}
  var before=state[a.s];var mn=Math.min(state.hunger,state.happy,state.clean,state.energy);
  state.points-=a.c;state[a.s]=clamp(state[a.s]+a.a);
  var xp=actionXp(a.xp,before,mn);gainXp(xp);
  moving=false;face.classList.remove("walk");mode="action";
  var wasteful=before>=88;
  if(t==="sleep"){fx(wasteful?"✋":"💤");setTimeout(function(){mode="idle";if(wasteful)bub(line("full"),2600);else speak("sleep");},700);}
  else{hop();fx(wasteful?"✋":(t==="feed"?"🍖":t==="play"?"🎉":"✨"));
    if(wasteful)bub(line("full"),2600);else if(mn<30)bub(line("lowcond"),3000);else speak(t);
    setTimeout(function(){if(mode==="action")mode="idle";},650);}
  render();saveSoon();}
function petClick(){
  if(state.stage===0){state.happy=clamp(state.happy+1);hop();fx("💗");bub(isPlant(state.species)?"쪼옥... (싹이 움직여요)":"콩콩... (안에서 소리가)",2400);render();saveSoon();return;}
  state.happy=clamp(state.happy+2);moving=false;mode="action";hop();fx("💗");speak("click",2400);setTimeout(function(){if(mode==="action")mode="idle";},620);render();saveSoon();}

/* ===== shop ===== */
var shopTab="hat";
function buildShop(){
  var l=$("shopList");l.innerHTML="";
  if(shopTab==="hat"){
    SHOP.hat.forEach(function(it){
      var owned=state.owned[it.slot].indexOf(it.id)>=0;
      var on=state.equipped[it.slot]===it.id;
      var btn;
      if(!owned)btn='<button class="ibtn" '+(state.points<it.cost?"disabled":"")+' data-buy="'+it.id+'">'+it.cost+' ⭐</button>';
      else btn='<button class="ibtn '+(on?"on":"own")+'" data-eq="'+it.id+'">'+(on?"착용중":"착용")+'</button>';
      l.appendChild(row(it,'착용 아이템 · '+(it.slot==="hat"?"모자":"상의"),owned?"":(it.cost+" ⭐"),btn));
    });
  } else if(shopTab==="prop"){
    SHOP.prop.forEach(function(it){
      var owned=state.owned.prop.indexOf(it.id)>=0;
      var placed=state.placed.indexOf(it.id)>=0;
      var btn;
      if(!owned)btn='<button class="ibtn" '+(state.points<it.cost?"disabled":"")+' data-buy="'+it.id+'">'+it.cost+' ⭐</button>';
      else btn='<button class="ibtn '+(placed?"on":"own")+'" data-place="'+it.id+'">'+(placed?"배치중":"배치")+'</button>';
      l.appendChild(row(it,it.d,owned?"":(it.cost+" ⭐"),btn));
    });
  } else {
    SHOP.buff.forEach(function(it){
      var owned=hasBuff(it.id);
      var btn=owned?'<button class="ibtn have" disabled>보유중</button>':'<button class="ibtn" '+(state.points<it.cost?"disabled":"")+' data-buy="'+it.id+'">'+it.cost+' ⭐</button>';
      l.appendChild(row(it,it.d,owned?"적용중 ✓":(it.cost+" ⭐"),btn));
    });
  }
  var bs=l.querySelectorAll("[data-buy]");for(var i=0;i<bs.length;i++)(function(b){b.addEventListener("click",function(){buy(b.dataset.buy);});})(bs[i]);
  var es=l.querySelectorAll("[data-eq]");for(var j=0;j<es.length;j++)(function(b){b.addEventListener("click",function(){toggleEquip(b.dataset.eq);});})(es[j]);
  var ps=l.querySelectorAll("[data-place]");for(var k=0;k<ps.length;k++)(function(b){b.addEventListener("click",function(){togglePlace(b.dataset.place);});})(ps[k]);
}
function row(it,desc,price,btn){var d=document.createElement("div");d.className="item";
  d.innerHTML='<div class="si">'+it.ic+'</div><div class="sib"><div class="sin">'+it.n+'</div><div class="sid">'+desc+'</div>'+(price?'<div class="price">'+price+'</div>':'')+'</div>'+btn;return d;}
function buy(id){var it=shopFind(id);if(!it||state.points<it.cost)return toast("포인트가 부족해요!");
  state.points-=it.cost;
  if(it.slot){state.owned[it.slot].push(id);state.equipped[it.slot]=id;setSprite();speak("dress");hop();fx("✨");}
  else if(SHOP.prop.indexOf(it)>=0){state.owned.prop.push(id);if(state.placed.indexOf(id)<0)state.placed.push(id);renderProps();}
  else{state.owned.buff.push(id);fx("✨");toast(it.ic+" 효과 적용!");}
  // detect category for prop (indexOf on object array)
  render();buildShop();saveSoon();
}
function toggleEquip(id){var it=shopFind(id);if(!it)return;state.equipped[it.slot]=(state.equipped[it.slot]===id)?null:id;setSprite();if(state.equipped[it.slot])speak("dress");buildShop();saveSoon();}
function togglePlace(id){var i=state.placed.indexOf(id);if(i>=0)state.placed.splice(i,1);else state.placed.push(id);renderProps();buildShop();saveSoon();}

function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2100);}

function timeOfDay(){var h=new Date().getHours();var sky=$("sky"),ce=$("celest"),st=$("stars"),ng=$("night");
  if(h>=6&&h<=16){sky.setAttribute("fill","#BFE3F5");ce.setAttribute("fill","#FFD66B");ce.setAttribute("cx","100");ce.setAttribute("cy","26");st.setAttribute("opacity","0");ng.style.opacity="0";}
  else if(h>=17&&h<=19){sky.setAttribute("fill","#F4C39A");ce.setAttribute("fill","#FF9E5E");ce.setAttribute("cx","28");ce.setAttribute("cy","46");st.setAttribute("opacity","0");ng.style.opacity=".08";}
  else{sky.setAttribute("fill","#2E3A5C");ce.setAttribute("fill","#EAF0FF");ce.setAttribute("cx","100");ce.setAttribute("cy","24");st.setAttribute("opacity","1");ng.style.opacity=".3";}}

function tick(){if(document.hidden)return;render();save();}
function chatter(){if(document.hidden||mode==="action")return;if(performance.now()-lastSpoke<4500)return;var c="idle";if(state.energy<22&&Math.random()<.6)c="tired";else if(state.hunger<28)c="hungry";else if(state.happy<28)c="lonely";else if(state.clean<26)c="dirty";if(Math.random()<.78)speak(c);if(isPlant(state.species)&&state.stage>=1&&Math.random()<.4)hop();}

function dailyAndWelcome(){
  var now=Date.now(),el=now-(state.lastSeen||now),hrs=el/3.6e6;
  var dm=hasBuff("slowdecay")?0.5:1;
  var decayHrs=Math.max(0,hrs-48);if(decayHrs>0){state.hunger=clamp(state.hunger-DECAY.hunger*decayHrs*dm);state.happy=clamp(state.happy-DECAY.happy*decayHrs*dm);state.clean=clamp(state.clean-DECAY.clean*decayHrs*dm);state.energy=clamp(state.energy-DECAY.energy*decayHrs*dm);}
  var today=new Date().toDateString(),gotDaily=false;
  if(state.lastLoginDay!==today){
    if(state.lastLoginDay){var pv=new Date(state.lastLoginDay),nw=new Date();var dd=Math.round((nw-pv)/86400000);state.streak=(dd===1)?(state.streak||0)+1:1;}else state.streak=1;
    state.maxStreak=Math.max(state.maxStreak||0,state.streak);
    var bonus=hasBuff("ptboost")?4:3;state.points+=bonus;state.lastLoginDay=today;state.visits=(state.visits||0)+1;gotDaily=true;
    setTimeout(function(){toast("🎁 출석 보너스 +"+bonus+"P (연속 "+state.streak+"일)");},500);
  }
  var low=(state.hunger<25||state.happy<22),mins=el/60000,cat=null;
  if(gotDaily)cat="daily";
  else if(mins<1.5)cat=null;else if(hrs<3)cat="wbShort";else if(hrs<24)cat="wbMid";else cat=low?"wbSad":"wbLong";
  if(state.stage===0&&!gotDaily)cat=(mins<1.5)?null:"wbShort";
  if(cat)setTimeout(function(){speak(cat,4000);},gotDaily?1400:700);
}

function startGame(){
  show("s-game");
  face=$("petface");petc=$("petc");room=$("room");bubble=$("bubble");
  ensure(state);
  labels();setSprite();renderProps();timeOfDay();
  bounds();posX=centerX;applyPos();face.classList.add("breathe");placePet();
  dailyAndWelcome();render();save();
  if(!startGame._wired){startGame._wired=true;
    var acts=document.querySelectorAll(".act[data-a]");for(var i=0;i<acts.length;i++)(function(b){b.addEventListener("click",function(){doFree(b.dataset.a);});})(acts[i]);
    face.addEventListener("click",petClick);
    $("shopBtn").addEventListener("click",function(){shopTab="hat";var tabs=document.querySelectorAll(".tab");for(var z=0;z<tabs.length;z++)tabs[z].classList.toggle("on",tabs[z].dataset.tab==="hat");buildShop();$("shopModal").classList.add("on");});
    $("shopClose").addEventListener("click",function(){$("shopModal").classList.remove("on");});
    var tabs=document.querySelectorAll(".tab");for(var t=0;t<tabs.length;t++)(function(tb){tb.addEventListener("click",function(){shopTab=tb.dataset.tab;for(var z=0;z<tabs.length;z++)tabs[z].classList.remove("on");tb.classList.add("on");buildShop();});})(tabs[t]);
    $("menuBtn").addEventListener("click",function(){var bf=state.owned.buff.length;$("menuStats").textContent=(state.nick||"")+" · 방문 "+(state.visits||0)+"회 · 연속 "+(state.streak||0)+"일 · "+STAGES[state.species][state.stage]+" 단계 · 효과 "+bf+"개";$("menuModal").classList.add("on");});
    $("menuClose").addEventListener("click",function(){$("menuModal").classList.remove("on");});
    $("logoutBtn").addEventListener("click",function(){$("menuModal").classList.remove("on");show("s-login");});
    $("resetBtn").addEventListener("click",async function(){if(confirm("정말 처음부터 다시 시작할까요? 기록이 사라져요.")){try{await store.delete(KEY,false);}catch(e){}location.reload();}});
    window.addEventListener("resize",function(){bounds();if(!moving)placePet();});
    document.addEventListener("visibilitychange",function(){if(document.hidden)save();else lastTs=0;});
    requestAnimationFrame(loop);setInterval(tick,30000);setInterval(chatter,8500);setInterval(timeOfDay,60000);
    nextAt=performance.now()+1400;
  }
}

(async function(){var s=await load();if(s&&s.nick){state=ensure(s);$("nick").value=s.nick||"";$("loginPhone").value=s.phone||"";}checkLogin();})();
</script>
</body>
