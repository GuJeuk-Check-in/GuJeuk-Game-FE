<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 가 있어야 env(safe-area-inset-*)가 실제 값을 갖는다.
         이게 없으면 노치 기기에서 셸의 상하단 패딩이 항상 0이 된다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f1420" />
    <!--
      점수판 숫자만 압축 서체를 쓴다. 한글은 이 서체에 없으므로 본문은 그대로
      시스템 서체가 받는다. 두 굵기만 받아 오고 swap이라 로드 전에도 글이 보인다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>양궁</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
